<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" dir="{{ page.text_direction | default: 'ltr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.keywords %}
    <meta name="keywords" content="{{ page.keywords }}">
    {% endif %}
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#7EC81F">
    <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ '/en' | absolute_url }}">
    <link rel="alternate" hreflang="zh-Hans" href="{{ '/zh-Hans' | absolute_url }}">
    <link rel="alternate" hreflang="zh-Hant" href="{{ '/zh-Hant' | absolute_url }}">
    <link rel="alternate" hreflang="ja" href="{{ '/ja' | absolute_url }}">
    <link rel="alternate" hreflang="ko" href="{{ '/ko' | absolute_url }}">
    <link rel="alternate" hreflang="es" href="{{ '/es' | absolute_url }}">
    <link rel="alternate" hreflang="fr" href="{{ '/fr' | absolute_url }}">
    <link rel="alternate" hreflang="de" href="{{ '/de' | absolute_url }}">
    <link rel="alternate" hreflang="ar" href="{{ '/ar' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Motune",
      "applicationCategory": "MusicApplication",
      "operatingSystem": "iOS, watchOS",
      "description": {{ page.description | default: site.description | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ '/assets/images/icon-192.png' | absolute_url | jsonify }},
      "offers": {
        "@type": "Offer",
        "availability": "https://schema.org/InStock",
        "url": "https://apps.apple.com/us/app/motune/id6768014814?uo=4"
      }
    }
    </script>
    {% if page.faq_schema %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Motune?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is an Apple Watch wrist gesture remote for music. It lets you control the current iPhone playback session with Watch gestures instead of touching earbuds, talking to Siri, or opening a tiny control screen."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Motune for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is built for runners, cyclists, commuters, gym users, winter walkers, open-ear headphone users, and anyone who wants faster music controls when hands, voice, or screen taps are inconvenient."
          }
        },
        {
          "@type": "Question",
          "name": "Why do I need Motune if my earbuds already have controls?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Earbud controls are useful, but they are not always reliable while running, cycling, sweating, wearing gloves, or adjusting the fit. Motune lets you control music from your wrist instead of touching the earbuds."
          }
        },
        {
          "@type": "Question",
          "name": "Why not just use Siri?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Siri can work, but music control is a tiny, frequent action. Saying commands out loud can feel slow, awkward in public, or unreliable in noisy places. Motune is silent and does not require voice commands."
          }
        },
        {
          "@type": "Question",
          "name": "Why not use Apple Watch Now Playing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Apple Watch Now Playing works when you can look at the screen and tap. Motune is designed for eyes-free wrist gestures during running, cycling, commuting, wearing gloves, or carrying something."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune work with Spotify, Apple Music, or Shokz?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune controls system-level media playback. It can be useful with Apple Music, Spotify, AirPods, Shokz, open-ear headphones, bone conduction headphones, and other earbuds when current playback supports system media controls."
          }
        },
        {
          "@type": "Question",
          "name": "What apps can Motune control?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune can control the current iPhone playback session when the app responds to iOS system media commands. Common use cases include Apple Music, Spotify, YouTube Music, YouTube, Podcasts, Audible, Overcast, Pocket Casts, TikTok audio or video playback, QQ Music, NetEase Cloud Music, KuGou Music, Kuwo Music, and other audio apps that support system playback controls."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune support Spotify?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune can be useful with Spotify when Spotify is the current playback source and responds to iPhone system media controls. Many users look for this because Apple Watch Double Tap and Spotify workflows do not always feel direct enough."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune support YouTube Music, YouTube, TikTok, or TikTok Music?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is not tied to one music service. If YouTube Music, YouTube, TikTok, TikTok Music-style playback, or another media app exposes play, pause, next, or previous through iOS system media controls, Motune can send those commands from Apple Watch gestures."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune support QQ Music or NetEase Cloud Music?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune can work with Chinese music apps such as QQ Music, NetEase Cloud Music, KuGou Music, Kuwo Music, and similar players when they respond to iOS system media controls for the current playback session."
          }
        },
        {
          "@type": "Question",
          "name": "What headphones work well with Motune?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is headphone-agnostic because it controls playback from Apple Watch and iPhone. It can fit AirPods, AirPods Pro, Beats, Shokz, Bose, Sony, open-ear headphones, bone conduction headphones, running earbuds, cycling headphones, gym earbuds, and winter-glove setups."
          }
        },
        {
          "@type": "Question",
          "name": "How is Motune different from Siri, AirPods controls, Double Tap, and Now Playing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Siri uses voice, AirPods and earbuds use tiny touch or button controls, Double Tap is a system gesture with limited context, and Now Playing needs screen attention. Motune is a dedicated Apple Watch wrist gesture remote for music actions you can customize."
          }
        },
        {
          "@type": "Question",
          "name": "Is Motune a music player?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Motune is not a music streaming app and does not replace Spotify, Apple Music, or your favorite player. Start music in the app you already use, then use Motune as a Watch gesture remote for playback control."
          }
        },
        {
          "@type": "Question",
          "name": "Can Motune help when Apple Watch Double Tap is not enough?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is designed for people who want a dedicated music-control workflow on Apple Watch. It gives previous, next, play, and pause their own gesture mappings instead of depending on a single system gesture behavior."
          }
        },
        {
          "@type": "Question",
          "name": "What music actions can I control?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune focuses on the core actions people need most often: previous track, next track, play, and pause. You can keep the default mapping or customize which gesture triggers which action."
          }
        },
        {
          "@type": "Question",
          "name": "What gestures does Motune use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune uses clear wrist motions such as rotate outward, rotate inward, palm up, and palm down. For best recognition, make one gesture, return your wrist to a relaxed neutral position, then pause briefly."
          }
        },
        {
          "@type": "Question",
          "name": "What is Workout Mode?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Workout Mode is a user-started mode for active sessions such as running, walking, or training. It helps gesture control remain available during movement. Motune does not read heart rate, calories, activity rings, or workout history."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Motune while running or cycling?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune is useful for in-motion music control, especially when earbud taps, phone access, or screen taps are awkward. It is still only a convenience tool for music playback, so users should always pay attention to surroundings."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune help with winter gloves or bike gloves?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, that is one of the main use cases. Gloves make small touch targets and earbud controls harder to use. Motune moves the music-control action to intentional Apple Watch wrist gestures."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune work with open-ear or bone conduction headphones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune can be a useful control layer for Shokz, open-ear headphones, bone conduction headphones, AirPods, and everyday earbuds when the current iPhone playback responds to system media commands."
          }
        },
        {
          "@type": "Question",
          "name": "Does Motune collect personal data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Motune does not require an account, does not include ads, and does not use third-party analytics SDKs. Motion data for gesture recognition is processed locally, and optional gesture samples stay local when intentionally saved."
          }
        },
        {
          "@type": "Question",
          "name": "What do I need to use Motune?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You need an iPhone, a paired Apple Watch, Motune installed on both devices, and Apple Watch motion permission. Health permission is only needed if you choose to start Workout Mode."
          }
        },
        {
          "@type": "Question",
          "name": "What should I do if a gesture is not recognized?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the gesture guide, make the motion clearly, return to neutral, and pause about one second before the next action. You can also adjust gesture actions or use the advanced recognition settings if you want more control."
          }
        }
      ]
    }
    </script>
    {% endif %}
  </head>
  <body>
    <main class="page">
      {{ content }}
    </main>
  </body>
</html>
